name: Validate classroom
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check adaptive-reactor-engine.mjs
          node --check adaptive-reactor-ui.mjs
          node --check adaptive-arena-engine.mjs
          node --check adaptive-arena-ui.mjs
          node --check circuits.mjs
          node --check advanced-circuits.mjs
          node --check advanced-workbench.mjs
          node --check wiring-solver.mjs
          node --check wiring-diode-solver.mjs
          node --check wiring-meter.mjs
          node --check academy-engine.mjs
          node --check academy-ui.mjs
          node --check mystery-engine.mjs
          node --check mystery-ui.mjs
          node --check scope-engine.mjs
          node --check scope-ui.mjs
          node --check workstation-engine.mjs
          node --check workstation-ui.mjs
          node --check breadboard-engine.mjs
          node --check breadboard-ui.mjs
          node --check breadboard-bridge-engine.mjs
          node --check breadboard-bridge-ui.mjs
          node --check wiring-lab.mjs
          node --check relational369-engine.mjs
          node --check relational369-ui.mjs
          node --check relational369-language.mjs
          node --check relational369-discovery.mjs
          node --check relational369-language-ui.mjs
      - name: Run dependency-free model tests
        run: npm test
      - name: Exercise interactive wiring lab in headless Chrome
        run: npm run test:browser
